n:9px 0;min-height:76px}.entry .details{flex:1;min-width:0}.entry .name{font-weight:700;overflow-wrap:anywhere}.entry .meta{font-size:12px;color:var(--muted);margin-top:5px}.stepper{display:flex;align-items:center;gap:8px}.stepper button{width:35px;height:35px;border-radius:10px;border:1px solid #3b3b49;background:#242530;color:white;font-size:20px}.stepper button.plus{background:#a88af5;color:#171020;border-color:#a88af5}.stepper output{min-width:22px;text-align:center;font-weight:800}.more{border:0;background:none;color:#858497;font-size:23px;padding:6px}.fab{position:fixed;bottom:24px;right:max(22px,calc((100vw - 820px)/2 + 20px));border:0;border-radius:17px;background:#b59aff;color:#161020;font-weight:800;padding:16px 22px;box-shadow:0 10px 35px #100c22}.empty{text-align:center;padding:55px 15px;color:var(--muted)}dialog{background:#1b1c25;border:1px solid #464052;color:white;border-radius:22px;width:min(94vw,440px);padding:24px}dialog::backdrop{background:#000b}dialog h2{margin:0 0 20px}label{display:block;color:#c6c2d1;font-size:13px;margin:14px 0 6px}dialog input,dialog select{width:100%;background:#111219;color:white;border:1px solid #454351;border-radius:11px;padding:12px}dialog menu{padding:0;display:flex;justify-content:flex-end;gap:10px;margin:24px 0 0}dialog button{border:1px solid #44404e;border-radius:11px;background:#292832;color:white;padding:11px 15px}dialog button.primary{background:#b59aff;color:#161020;border:0;font-weight:800}.tools{display:flex;gap:8px;margin-top:22px}.tools button{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12px}.hint{font-size:12px;color:var(--muted);margin-top:10px}@media(max-width:460px){main{padding:23px 14px 105px}.logo{font-size:32px}.hero{padding:18px}.entry{padding:12px 10px}.stepper{gap:5px}.stepper button{width:32px;height:34px}.tabs button{padding:10px}}
main{padding-top:16px;padding-bottom:80px}.top{min-height:38px}.eyebrow{font-size:12px;letter-spacing:.12em}.subtitle{font-size:11px;margin-top:3px}.iconbtn{padding:8px 10px;border-radius:9px}.hero{margin:13px 0 12px;padding:12px 15px;border-radius:13px}.hero strong{font-size:21px}.hero span{font-size:10px}.hero .count strong{font-size:21px}.controls{gap:7px;margin-bottom:8px}.tabs{border-radius:9px;padding:3px}.tabs button{padding:7px 10px;font-size:12px;border-radius:7px}.search{padding:8px 10px;border-radius:9px;font-size:12px;min-width:110px}.season{padding:7px 10px;border-radius:9px;font-size:12px}.group{margin:15px 0 7px;font-size:12px}.entry{padding:7px 10px;border-radius:10px;min-height:49px;margin:5px 0;gap:7px}.entry .name{font-size:13px;font-weight:650}.entry .meta{font-size:10px;margin-top:2px}.stepper{gap:4px}.stepper button{width:27px;height:28px;border-radius:7px;font-size:17px}.stepper output{font-size:12px;min-width:17px}.more{font-size:18px;padding:3px}.fab{padding:10px 14px;border-radius:11px;font-size:12px;bottom:16px}.tools{margin-top:14px}.hint{font-size:10px}@media(max-width:460px){main{padding:14px 10px 75px}.hero{padding:12px}.entry{padding:7px 8px}.stepper button{width:26px;height:28px}.fab{right:12px}} body:not(.ready) main,body:not(.ready) .fab{visibility:hidden}#splash{position:fixed;inset:0;background:#0d0e13;display:grid;place-items:center;z-index:9999;transition:opacity .25s ease}#splash img{width:min(72vw,310px);max-height:75vh;object-fit:contain;border-radius:20px}body.ready #splash{opacity:0;pointer-events:none}@media(prefers-reduced-motion:reduce){#splash{transition:none}}</style></head><body><div id="splash" aria-label="Loading Anime Tracker"><img src="./anime_tracker_loading_screen.png" alt="Anime Tracker"></div><main><header class="top"><div><div class="eyebrow">ANIME TRACKER</div><div class="subtitle">Your weekly watchlist</div></div><button class="iconbtn" id="exportTop" aria-label="Export backup">↥</button></header><section class="hero"><div><span>CURRENT COLLECTION</span><div style="margin-top:8px"><strong id="watching">0</strong><div><span>Anime tracked</span></div></div></div><div class="count"><span>EPISODES WATCHED</span><div style="margin-top:8px"><strong id="total">0</strong></div></div></section><div class="controls"><div class="tabs"><button data-tab="az" class="active">A–Z</button><button data-tab="day">By day</button></div><input id="search" class="search" placeholder="Search anime..." aria-label="Search anime"><select id="season" class="season" aria-label="Season"><option>All seasons</option><option>Summer 2026</option><option>Fall 2026</option><option>Winter 2027</option><option>Spring 2027</option></select></div><div id="list"></div><div class="tools"><button id="export">Export backup</button><button id="import">Import backup</button><input type="file" id="file" accept="application/json" hidden></div><div class="hint">Stored locally on this device. Export a backup to keep your list safe.</div></main><button class="fab" id="add">＋ Add anime</button><dialog id="editor"><form id="form"><h2 id="dialogTitle">Add anime</h2><label for="animeName">Anime title</label><input id="animeName" required maxlength="180" placeholder="e.g. Blue Box"><label for="animeEp">Current episode</label><input id="animeEp" type="number" min="0" max="99999" value="0" required><label for="animeDay">Release day</label><select id="animeDay"><option value="">Not assigned</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select><label for="animeSeason">Season</label><select id="animeSeason"><option>Summer 2026</option><option>Fall 2026</option><option>Winter 2027</option><option>Spring 2027</option><option>Other</option></select><label for="animeNote">Note (optional)</label><input id="animeNote" placeholder="Hindi, dub, etc."><menu><button type="button" id="cancel">Cancel</button><button class="primary">Save anime</button></menu></form></dialog><script>
const seed=[["A Certain Item",4],["A tale of Secret saint",7],["Blue Box",5,"Hindi"],["Battle Spirits",5],["Control With Mouse",1],["Cheat Granting Mage",5],["Chitose Ramune Bottle",17],["Clearing another world",5],["Dark Summoner",6],["Dark Machine",2],["Detective Is Already Dead",5],["Firefly wedding",5],["Hello I am a witch",6],["Horror Collector",3],["Ice Blade",7],["Jobless Recantation",14],["My Gf's Friend",6],["Magic repo man",6],["Magical Explorer",6],["Mission Yozakura",17],["Overgeared",7,"Hindi","Sunday"],["psyren",4],["Ranma",6,"Hindi"],["Returners Magic",4],["Sato-san is Only Sweet to Me",5],["Strongest Witch",5],["Suikoden",5],["The Exiled Heavy Knight",19],["The Ramparts of Ice",6,"Hindi"],["Vermillion Mask",5],["Vertex Force",5],["Wild last boss",7]];
const KEY='frame_anime_v1';let data;try{const v=JSON.parse(localStorage.getItem(KEY));data=Array.isArray(v)?v:seed.map((a,i)=>({id:'seed-'+i,name:a[0],ep:a[1],note:a[2]||'',day:a[3]||'',season:'Summer 2026'}))}catch{data=seed.map((a,i)=>({id:'seed-'+i,name:a[0],ep:a[1],note:a[2]||'',day:a[3]||'',season:'Summer 2026'}))}const OLD_DEFAULTS={'dark summoner':5,'hello i am a witch':5,'mission yozakura':15};const normalize=n=>String(n||'').toLowerCase().replace(/[^a-z0-9]/g,'');const aliases={'jobless recantation':'joblessreincarnation'};const known=new Map(data.map(a=>[normalize(a.name),a]));let changed=false;for(let i=0;i<seed.length;i++){const a=seed[i],key=normalize(a[0]),match=known.get(key)||known.get(aliases[key]);if(match){if(Object.prototype.hasOwnProperty.call(OLD_DEFAULTS,key)&&Number(match.ep)===OLD_DEFAULTS[key]){match.ep=a[1];changed=true}if(match.name!==a[0]){match.name=a[0];changed=true}if(a[2]&&!match.note){match.note=a[2];changed=true}if(a[3]&&!match.day){match.day=a[3];changed=true}}else{data.push({id:'seed-v2-'+i,name:a[0],ep:a[1],note:a[2]||'',day:a[3]||'',season:'Summer 2026'});changed=true}}if(changed)localStorage.setItem(KEY,JSON.stringify(data));let tab='az',editing=null;const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(data));save();const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];function el(tag,cls,content){const n=document.createElement(tag);if(cls)n.className=cls;if(content!==undefined)n.textContent=content;return n}function render(){const query=$('search').value.trim().toLowerCase(),season=$('season').value;const items=data.filter(a=>a.name.toLowerCase().includes(query)&&(season==='All seasons'||a.season===season));$('watching').textContent=data.length;$('total').textContent=data.reduce((s,a)=>s+(Number(a.ep)||0),0);const root=$('list');root.replaceChildren();if(!items.length){root.append(el('div','empty','No anime found. Add one to get started.'));return}const groups=tab==='az'?[...new Set(items.map(a=>(a.name[0]||'#').toUpperCase()))].sort():[...days,'Not assigned'];for(const g of groups){const group=items.filter(a=>tab==='az'?(a.name[0]||'#').toUpperCase()===g:(a.day||'Not assigned')===g).sort((a,b)=>a.name.localeCompare(b.name));if(!group.length)continue;root.append(el('div','group',g));for(const a of group){const row=el('div','entry'),details=el('div','details');details.append(el('div','name',a.name),el('div','meta',[ 'Episode '+a.ep,a.note,a.day].filter(Boolean).join(' · ')));const step=el('div','stepper'),minus=el('button','','−'),out=el('output','',a.ep),plus=el('button','plus','+');minus.setAttribute('aria-label','Decrease episode for '+a.name);plus.setAttribute('aria-label','Increase episode for '+a.name);minus.onclick=()=>{a.ep=Math.max(0,Number(a.ep)-1);save();render()};plus.onclick=()=>{a.ep=Number(a.ep)+1;save();render()};step.append(minus,out,plus);const more=el('button','more','⋯');more.setAttribute('aria-label','Edit '+a.name);more.onclick=()=>openEditor(a.id);row.append(details,step,more);root.append(row)}}}function openEditor(id=null){editing=id;const a=data.find(x=>x.id===id);$('dialogTitle').textContent=a?'Edit anime':'Add anime';$('animeName').value=a?.name||'';$('animeEp').value=a?.ep??0;$('animeDay').value=a?.day||'';$('animeSeason').value=a?.season||'Summer 2026';$('animeNote').value=a?.note||'';$('editor').showModal()}$('add').onclick=()=>openEditor();$('cancel').onclick=()=>$('editor').close();$('form').onsubmit=e=>{e.preventDefault();const obj={id:editing||('anime-'+Date.now()+'-'+Math.random().toString(36).slice(2)),name:$('animeName').value.trim(),ep:Math.max(0,Number($('animeEp').value)),day:$('animeDay').value,season:$('animeSeason').value,note:$('animeNote').value.trim()};if(!obj.name)return;if(editing){data=data.map(x=>x.id===editing?obj:x)}else data.push(obj);save();$('editor').close();render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});$('search').oninput=render;$('season').onchange=render;function backup(){const blob=new Blob([JSON.stringify({version:1,anime:data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='frame-anime-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('export').onclick=backup;$('exportTop').onclick=backup;$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const v=JSON.parse(await f.text()),arr=Array.isArray(v)?v:v.anime;if(!Array.isArray(arr)||arr.length>10000||!arr.every(x=>x&&typeof x.name==='string'&&x.name.length<=180&&Number.isInteger(Number(x.ep))&&Number(x.ep)>=0&&Number(x.ep)<=99999))throw Error('Invalid backup');if(!confirm('Replace your current anime list with this backup?'))return;data=arr.map((x,i)=>({id:String(x.id||'import-'+i),name:x.name,ep:Number(x.ep),day:days.includes(x.day)?x.day:'',season:String(x.season||'Other'),note:String(x.note||'').slice(0,500)}));save();render();alert('Backup imported')}catch{alert('Could not import this backup.')}finally{e.target.value=''}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();document.body.classList.add('ready');setTimeout(()=>document.getElementById('splash')?.remove(),300);
</script></body></html>
